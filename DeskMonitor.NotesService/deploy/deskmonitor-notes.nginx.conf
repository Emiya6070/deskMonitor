location = /deskmonitor-notes {
    return 308 /deskmonitor-notes/;
}

# RFC 8414 / RFC 9728 discovery for an issuer/resource with a path prefix.
location = /.well-known/oauth-authorization-server/deskmonitor-notes {
    proxy_pass http://127.0.0.1:5088/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource/deskmonitor-notes/mcp {
    proxy_pass http://127.0.0.1:5088/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Public integration schema contains no credential or note content.
location = /deskmonitor-notes/openapi.json {
    alias /opt/deskmonitor-notes/integration/openapi.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location ^~ /deskmonitor-notes/ {
    proxy_pass http://127.0.0.1:5088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 768k;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
